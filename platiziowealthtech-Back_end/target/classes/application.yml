spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: wealthtech-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    clean-on-validation-error: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081

cybrilla:
  integration:
    real-client-enabled: ${CYBRILLA_REAL_CLIENT_ENABLED:true}
  pre-verification:
    base-url: ${CYBRILLA_PRE_VERIFICATION_BASE_URL:https://api.sandbox.cybrilla.com}
    auth:
      token-url: ${CYBRILLA_PRE_VERIFICATION_TOKEN_URL:https://s.finprim.com/v2/auth/cybrillarta/token}
      client-id: ${CYBRILLA_PRE_VERIFICATION_CLIENT_ID:}
      client-secret: ${CYBRILLA_PRE_VERIFICATION_CLIENT_SECRET:}
      refresh-buffer-seconds: ${CYBRILLA_TOKEN_REFRESH_BUFFER_SECONDS:0}

finprim:
  base-url: ${FINPRIM_BASE_URL:https://s.finprim.com}
  tenant:
    name: ${FINPRIM_TENANT_NAME:platizio}
    id: ${FINPRIM_TENANT_ID:}
    auth:
      token-url: ${FINPRIM_TENANT_TOKEN_URL:}
      client-id: ${FINPRIM_TENANT_CLIENT_ID:}
      client-secret: ${FINPRIM_TENANT_CLIENT_SECRET:}
      refresh-buffer-seconds: ${FINPRIM_TOKEN_REFRESH_BUFFER_SECONDS:0}

external-auth:
  auto-refresh:
    enabled: ${EXTERNAL_AUTH_AUTO_REFRESH_ENABLED:false}
    check-interval-ms: ${EXTERNAL_AUTH_AUTO_REFRESH_CHECK_INTERVAL_MS:60000}
    startup-delay-ms: ${EXTERNAL_AUTH_AUTO_REFRESH_STARTUP_DELAY_MS:60000}
  token-cache:
    enabled: ${EXTERNAL_AUTH_TOKEN_CACHE_ENABLED:true}
    file: ${EXTERNAL_AUTH_TOKEN_CACHE_FILE:${user.home}/.platizio-wealthtech/external-auth-token-cache.json}
  debug:
    enabled: ${EXTERNAL_AUTH_DEBUG_ENABLED:false}
    log-raw-tokens: ${EXTERNAL_AUTH_LOG_RAW_TOKENS:false}

jwt:
  secret: ${JWT_SECRET:wealthtech-super-secret-key-change-in-production-must-be-256-bits-long}
  expiration-ms: 86400000  # 24 hours

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:access_token}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
