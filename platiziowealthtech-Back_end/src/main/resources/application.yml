spring:
  application:
    name: wealthtech-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8081

cybrilla:
  base-url: ${CYBRILLA_BASE_URL:https://api.cybrilla.example}
  api-key: ${CYBRILLA_API_KEY:}
  partner-id: ${CYBRILLA_PARTNER_ID:}

jwt:
  secret: ${JWT_SECRET:wealthtech-super-secret-key-change-in-production-must-be-256-bits-long}
  expiration-ms: 86400000  # 24 hours

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
