spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:file:./.env[.properties]
  application:
    name: wealthtech-backend
  datasource:
    # R11: a full DB_URL still wins if set (back-compat); otherwise the JDBC URL is built
    # from parts (DB_HOST/DB_PORT/DB_NAME) which Render injects via render.yaml `fromDatabase`.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  # Email OTP delivery. Point these at any free SMTP provider:
  #   Gmail   -> host smtp.gmail.com, port 587, username <gmail>, password <app-password>
  #   Brevo   -> host smtp-relay.brevo.com, port 587
  #   Mailtrap-> host sandbox.smtp.mailtrap.io, port 587 (testing inbox)
  # Leave MAIL_HOST empty to run without SMTP: the OTP is logged (and, on the
  # local profile, returned in the API response) instead of being emailed.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
        transport:
          protocol: smtp
    test-connection: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    clean-on-validation-error: false
    # V1..V36 were squashed into V1..V3. Existing DBs keep history rows for the
    # removed versions; ignore them during validation (the repair-before-migrate
    # strategy in FlywayConfig also marks them deleted and realigns checksums).
    baseline-on-migrate: true
    baseline-version: 0
    ignore-migration-patterns: "*:missing"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    # SMTP is optional locally (OTP is logged when MAIL_HOST is unset). Without this,
    # MailHealthIndicator marks the app DOWN even though PostgreSQL and APIs are fine.
    mail:
      enabled: false

server:
  port: ${PORT:${SERVER_PORT:8081}}

cybrilla:
  # sandbox | production — production enables live PAN/KYC verification for any valid Indian PAN.
  environment: ${CYBRILLA_ENVIRONMENT:sandbox}
  webhook:
    # Required outside the local profile. Cybrilla sends this value in X-Cybrilla-Webhook-Secret.
    secret: ${CYBRILLA_WEBHOOK_SECRET:}
  integration:
    real-client-enabled: ${CYBRILLA_REAL_CLIENT_ENABLED:true}
    # When true, import Finprim catalogue on startup if fewer than 3 local schemes exist.
    bootstrap-catalogue-on-startup: ${CYBRILLA_BOOTSTRAP_CATALOGUE_ON_STARTUP:false}
    # cybrilla = live Finprim catalogue (default). local = PostgreSQL seed/manual rows only.
    product-catalogue-source: ${CYBRILLA_PRODUCT_CATALOGUE_SOURCE:cybrilla}
    # poa-mf | oms-fund-schemes | sif-poa — see Finprim POA gateway docs.
    product-catalogue-endpoint: ${CYBRILLA_PRODUCT_CATALOGUE_ENDPOINT:poa-mf}
    # Skip full Finprim catalogue re-import when a sync ran recently (aligns with ~30m JWT lifetime).
    catalogue-refresh-min-interval-minutes: ${CYBRILLA_CATALOGUE_REFRESH_MIN_INTERVAL_MINUTES:25}
    # cybrilla = reconcile investor list from GET /v2/investor_profiles before reads (default).
    # local = PostgreSQL investors table only (demo/offline).
    investor-data-source: ${CYBRILLA_INVESTOR_DATA_SOURCE:cybrilla}
    investor-sync-min-interval-minutes: ${CYBRILLA_INVESTOR_SYNC_MIN_INTERVAL_MINUTES:5}
  payment:
    mandate-provider-name: ${CYBRILLA_MANDATE_PROVIDER_NAME:CYBRILLAPOA}
    sandbox-simulate-mandate-approval: ${CYBRILLA_SANDBOX_SIMULATE_MANDATE_APPROVAL:true}
    sandbox-simulate-payment: ${CYBRILLA_SANDBOX_SIMULATE_PAYMENT:true}
  kyc-form:
    # Frontend origin the investor is redirected back to after the Digilocker
    # and eSign journeys. Used to build proof_details_callback_url / esign_callback_url.
    callback-base-url: ${CYBRILLA_KYC_FORM_CALLBACK_BASE_URL:http://localhost:3000}
    # When Cybrilla returns 403 "Partner not allowed to access kyc_forms", synthesize
    # mock POA responses locally so the modify workflow can be exercised in dev.
    mock-fallback-on-access-denied: ${CYBRILLA_KYC_FORM_MOCK_FALLBACK:false}
  kyc:
    identity-document:
      # Postback path appended to callback-base-url for FP /v2/identity_documents Digilocker return.
      postback-path: ${CYBRILLA_IDENTITY_DOCUMENT_POSTBACK_PATH:/distributor/investor-onboarding}
    esign:
      # Postback path appended to callback-base-url for FP /v2/esigns completion return.
      postback-path: ${CYBRILLA_ESIGN_POSTBACK_PATH:/distributor/investor-onboarding}
  pre-verification:
    base-url: ${CYBRILLA_PRE_VERIFICATION_BASE_URL:https://api.sandbox.cybrilla.com}
    # Unset = auto (simulator PANs enforced in sandbox, real PANs allowed in production).
    enforce-sandbox-pan-patterns: ${CYBRILLA_ENFORCE_SANDBOX_PAN_PATTERNS:}
    auth:
      token-url: ${CYBRILLA_PRE_VERIFICATION_TOKEN_URL:https://s.finprim.com/v2/auth/cybrillarta/token}
      client-id: ${CYBRILLA_PRE_VERIFICATION_CLIENT_ID:}
      client-secret: ${CYBRILLA_PRE_VERIFICATION_CLIENT_SECRET:}
      refresh-buffer-seconds: ${CYBRILLA_TOKEN_REFRESH_BUFFER_SECONDS:120}

finprim:
  base-url: ${FINPRIM_BASE_URL:https://s.finprim.com}
  tenant:
    name: ${FINPRIM_TENANT_NAME:platizio}
    id: ${FINPRIM_TENANT_ID:}
    auth:
      token-url: ${FINPRIM_TENANT_TOKEN_URL:}
      client-id: ${FINPRIM_TENANT_CLIENT_ID:}
      client-secret: ${FINPRIM_TENANT_CLIENT_SECRET:}
      refresh-buffer-seconds: ${FINPRIM_TOKEN_REFRESH_BUFFER_SECONDS:120}

# Supabase Auth (GoTrue) — backend-mediated email + mobile OTP for investor
# contact verification (Tier 2). real-client-enabled defaults to false here so
# the app still boots without a Supabase project (DisabledSupabaseAuthClient,
# dev code 000000). In the deployed/dev env it is overridden to TRUE via the
# git-ignored .env (SUPABASE_URL + SUPABASE_ANON_KEY), so RealSupabaseAuthClient
# is active and EMAIL OTP is live-verified. For the email to carry a 6-digit
# code, the dashboard Magic Link template must include {{ .Token }}.
# MOBILE/SMS OTP is DEFERRED: sms-enabled defaults to false because the Supabase
# Phone provider is disabled (likely needs a paid plan). The mobile OTP endpoints
# return a clean 400 ("use self-declaration") and contact-status reports
# smsOtpEnabled=false until SUPABASE_SMS_ENABLED=true AND Authentication ->
# Providers -> Phone is enabled with an SMS provider in the dashboard.
supabase:
  auth:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    create-user: ${SUPABASE_CREATE_USER:true}
    real-client-enabled: ${SUPABASE_REAL_CLIENT_ENABLED:false}
    sms-enabled: ${SUPABASE_SMS_ENABLED:false}

external-auth:
  auto-refresh:
    # Scheduled refresh runs every ~30 minutes by default and only renews tokens already in cache.
    enabled: ${EXTERNAL_AUTH_AUTO_REFRESH_ENABLED:true}
    # When true, load or fetch both OAuth tokens at startup. When false, first Cybrilla/FP API call acquires them.
    warm-on-startup: ${EXTERNAL_AUTH_WARM_ON_STARTUP:true}
    check-interval-ms: ${EXTERNAL_AUTH_AUTO_REFRESH_CHECK_INTERVAL_MS:1800000}
    startup-delay-ms: ${EXTERNAL_AUTH_AUTO_REFRESH_STARTUP_DELAY_MS:1800000}
  token-cache:
    enabled: ${EXTERNAL_AUTH_TOKEN_CACHE_ENABLED:true}
    file: ${EXTERNAL_AUTH_TOKEN_CACHE_FILE:${user.home}/.platizio-wealthtech/external-auth-token-cache.json}
  debug:
    enabled: ${EXTERNAL_AUTH_DEBUG_ENABLED:false}
    log-raw-tokens: ${EXTERNAL_AUTH_LOG_RAW_TOKENS:false}

# Know-Your-Distributor (ARN/KYD) validation provider. When real-client-enabled is false (default),
# a deterministic mock placeholder validates ARNs so distributor signup works before a real provider
# is configured. Set real-client-enabled=true + base-url (+ api-key) to plug in the real AMFI/KYD API.
arn-validation:
  real-client-enabled: ${ARN_VALIDATION_REAL_CLIENT_ENABLED:false}
  base-url: ${ARN_VALIDATION_BASE_URL:}
  lookup-path: ${ARN_VALIDATION_LOOKUP_PATH:/arn/{arn}}
  api-key: ${ARN_VALIDATION_API_KEY:}
  source: ${ARN_VALIDATION_SOURCE:AMFI}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 900000  # 15 minutes

app:
  payment:
    postback-url: ${PAYMENT_POSTBACK_URL:http://localhost:8081/investor-actions/{token}/payment-complete}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:5173}
  auth:
    cookie-name: ${AUTH_COOKIE_NAME:access_token}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:refresh_token}
    refresh-token-expiration-ms: ${AUTH_REFRESH_TOKEN_EXPIRATION_MS:604800000}  # 7 days
    # Investor portal (Phase 1): a distinct passwordless session cookie so investor
    # and distributor sessions never collide in one browser. 1h access token; the
    # investor re-OTPs after expiry (investor refresh-token rotation is a follow-up).
    investor-cookie-name: ${INVESTOR_AUTH_COOKIE_NAME:investor_access_token}
    investor-access-expiration-ms: ${INVESTOR_ACCESS_EXPIRATION_MS:3600000}  # 1 hour
    cookie-secure: ${AUTH_COOKIE_SECURE}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
    blocked-token-purge-interval-ms: ${AUTH_BLOCKED_TOKEN_PURGE_INTERVAL_MS:3600000}
    blocked-token-purge-initial-delay-ms: ${AUTH_BLOCKED_TOKEN_PURGE_INITIAL_DELAY_MS:${random.int[30000,90000]}}
  frontend:
    # Base origin of the deployed frontend; used to build investor-facing links
    # (e.g. the approval-link email -> <origin>/investor/approve?token=...).
    origin: ${APP_FRONTEND_ORIGIN:http://localhost:3000}
  otp:
    # One-time passcode for email login/signup verification.
    length: ${OTP_LENGTH:6}
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
    from-address: ${MAIL_FROM:no-reply@platizio.local}
    from-name: ${MAIL_FROM_NAME:Platizio}
    # DF-13: when true (local dev only) and SMTP is disabled, the live code is
    # echoed in the OTP response so devs can test without email. MUST stay false
    # in every deployed/demo environment — the local profile overrides it to true.
    expose-dev-code: ${OTP_EXPOSE_DEV_CODE:false}
  demo:
    # DF-12: demo-only order lifecycle simulator (DemoOrderAdvancer). Off by
    # default; the local profile enables it. A demo profile can opt in to show
    # orders auto-completing (PAYMENT_PENDING -> SUCCESSFUL) without a webhook.
    order-advancer-enabled: ${DEMO_ORDER_ADVANCER_ENABLED:false}
  password-reset:
    # DF-13 (adjacent): when true (local dev only) the raw reset token is echoed
    # in the forgot-password response so devs can reset without email. MUST stay
    # false in every deployed/demo environment — the local profile overrides it.
    expose-dev-token: ${PASSWORD_RESET_EXPOSE_DEV_TOKEN:false}
  kyc-sync:
    enabled: ${KYC_SYNC_ENABLED:true}
    interval-ms: ${KYC_SYNC_INTERVAL_MS:180000}
    batch-size: ${KYC_SYNC_BATCH_SIZE:50}
    failure-backoff-ms: ${KYC_SYNC_FAILURE_BACKOFF_MS:900000}
    pre-verification-poll-max-attempts: ${KYC_PRE_VERIFICATION_POLL_MAX_ATTEMPTS:15}
    pre-verification-poll-interval-ms: ${KYC_PRE_VERIFICATION_POLL_INTERVAL_MS:2000}
  kyc-form-sync:
    # Polling fallback for the KYC Forms (modify) workflow. Webhooks are primary;
    # enable this only if you cannot rely on webhook delivery.
    enabled: ${KYC_FORM_SYNC_ENABLED:false}
    interval-ms: ${KYC_FORM_SYNC_INTERVAL_MS:180000}
    batch-size: ${KYC_FORM_SYNC_BATCH_SIZE:50}
  bank-sync:
    failure-backoff-ms: ${BANK_SYNC_FAILURE_BACKOFF_MS:900000}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
