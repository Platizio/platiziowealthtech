spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:1234}
  flyway:
    clean-disabled: false
  jpa:
    properties:
      hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS: ${HIBERNATE_SLOW_QUERY_MS:250}

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-32-bytes-minimum-not-for-prod}

app:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # Vite proxies /api/v1 to :8081 — browser sees same-origin; Lax is correct for HTTP dev.
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  otp:
    # Local dev only: echo the OTP in the response when SMTP is disabled. Never
    # set true in application.yml or any deployed/demo profile (DF-13).
    expose-dev-code: ${OTP_EXPOSE_DEV_CODE:true}
    # Local dev only: a fixed master passcode accepted for ANY login/signup OTP
    # (never for transaction-approval). Lets anyone sign in without SMTP. MUST stay
    # blank in application.yml / any deployed profile (DF-13).
    dev-master-code: ${OTP_DEV_MASTER_CODE:000000}
  demo:
    # Local dev keeps the order simulator so transactions reach SUCCESSFUL (DF-12).
    order-advancer-enabled: ${DEMO_ORDER_ADVANCER_ENABLED:true}
  password-reset:
    # Local dev only: echo the reset token so devs can reset without SMTP (DF-13).
    expose-dev-token: ${PASSWORD_RESET_EXPOSE_DEV_TOKEN:true}

external-auth:
  auto-refresh:
    # Local dev: fetch POA/FP tokens lazily on first API use instead of every restart.
    warm-on-startup: false

cybrilla:
  kyc-form:
    mock-fallback-on-access-denied: ${CYBRILLA_KYC_FORM_MOCK_FALLBACK:true}

logging:
  level:
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}
    org.hibernate.SQL_SLOW: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: ${HIBERNATE_BIND_LOG_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${HIBERNATE_BIND_LOG_LEVEL:WARN}
